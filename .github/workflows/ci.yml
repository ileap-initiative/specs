on: [push]

name: CI

jobs:
  build_and_test:
    name: Build Tech Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build docs
        run: aa-exec --profile=chrome make
